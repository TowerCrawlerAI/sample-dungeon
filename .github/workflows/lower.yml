name: Lower floor.lua

# Runs on every push and PR, and can be triggered manually.
# Produces build/floor.lua as a downloadable artifact.
#
# TODO(F4): once fml-parser cuts a release, pin to that release tag here
#           instead of tracking @main.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lower:
    name: Lower Bone Garden FML → floor.lua
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sample-dungeon
        uses: actions/checkout@v4

      - name: Checkout stdlib (the `[stdlib](stdlib)` import dependency)
        # The floor imports the stdlib catalog; CI has no sibling clone, so fetch
        # it and point the parser at it via FML_STDLIB_PATH (resolution order in
        # fml_parser _resolve_import_path). TODO(F4): pin to a released stdlib.
        #
        # The checkout dir MUST be named `stdlib`: the parser classifies
        # stdlib-sourced entities (pruneable catalog content) by the path
        # containing a `stdlib` component (fml_parser/parser.py,
        # is_stdlib_import). A previous `_stdlib` name defeated that check, so
        # tree-shake kept the whole catalog and the lowered floor (~1600 lines,
        # 72 engine.define_verb blocks) failed to load in the engine.
        uses: actions/checkout@v4
        with:
          repository: TowerCrawlerAI/stdlib
          path: stdlib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fml-parser
        # Interim: install from main until F4 ships a tagged release.
        # TODO(F4): replace with `pip install fml-parser==<version>` once available.
        run: |
          pip install "fml_parser @ git+https://github.com/TowerCrawlerAI/clotho@main"

      - name: Lower index.md → build/floor.lua
        env:
          FML_STDLIB_PATH: ${{ github.workspace }}/stdlib/index.md
        run: make lower

      # Assert that every room with authored art has the correct relative art.src
      # in map.json — no absolute URL injected at lowering time (the resolver in
      # Shuttle is the only place that composes absolute URLs per §40 of the
      # static-assets design). This is the round-trip check the §31 acceptance
      # criteria require: FML image: → Clotho → map.json rooms.<id>.art.src must
      # carry the exact relative logical path, verbatim.
      - name: Assert art.src round-trips in map.json
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("build/map.json") as f:
              m = json.load(f)
          rooms = m.get("rooms", {})
          # Expected: the relative logical paths that match the static-assets layout
          # (static-assets/sample-dungeon/img/rooms/<name>_background.jpg) and the
          # sync-assets.mjs mapping (→ public/art/<same path>).
          # The resolver (assets.ts, default base /art) composes:
          #   resolveAssetUrl("sample-dungeon/img/rooms/entry_background.jpg")
          #   → /art/sample-dungeon/img/rooms/entry_background.jpg
          expected = {
              "entry":         "sample-dungeon/img/rooms/entry_background.jpg",
              "garden":        "sample-dungeon/img/rooms/garden_background.jpg",
              "hall_of_skulls": "sample-dungeon/img/rooms/hall_of_skulls_background.jpg",
              "ossuary":       "sample-dungeon/img/rooms/ossuary_background.jpg",
          }
          errors = []
          for room_id, want in expected.items():
              art = rooms.get(room_id, {}).get("art")
              got = art.get("src") if art else None
              if got != want:
                  errors.append(f"  {room_id}: expected {want!r}, got {got!r}")
              elif got.startswith(("http://", "https://", "/")):
                  errors.append(f"  {room_id}: src must be relative, got {got!r}")
          if errors:
              print("FAIL: map.json art.src mismatch:", file=sys.stderr)
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(expected)} room art refs round-trip correctly as relative paths.")
          EOF

      - name: Upload floor.lua artifact
        uses: actions/upload-artifact@v4
        with:
          name: floor-lua
          path: build/floor.lua
          if-no-files-found: error
          retention-days: 30

      # `make lower` now also emits build/map.json (the --map sidecar).
      # if-no-files-found: error makes this the gate: CI fails if the map
      # sidecar wasn't produced, so the --map wiring can't silently regress.
      - name: Upload map.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: floor-map
          path: build/map.json
          if-no-files-found: error
          retention-days: 30
